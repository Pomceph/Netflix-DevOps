---

name: Netflix DevSecOps Project Pipeline

on: 
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      
      - name: Set Short SHA
        run: |
          echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV
      
      - name: Build Docker Image
        run: |
          docker build --build-arg TMDB_V3_API_KEY=${{ secrets.TMDB_V3_API_KEY }} -t pomceph/netflix:${{ env.SHORT_SHA }} -f netflix-frontend/Dockerfile .
      
      - name: Login to Dockerhub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      
      - name: Push to Dockerhub
        run: |
          docker push pomceph/netflix:${{ env.SHORT_SHA }}

      - name: Configure Git Author
        run: |
          git config --local user.name "Pomceph"
          git config --local user.email "${{ secrets.EMAIL }}"

      - name: Update Helm Chart with new image tag
        run: |
          sed -i "s/tag:.*/tag: ${{ env.SHORT_SHA }}/" ./helm-netflix-devops/values.yaml
          git add ./helm-netflix-devops/values.yaml
          git commit -m "Updated image tag to ${{ env.SHORT_SHA }}"
          git push 

      
    
    